<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Multi-Sport AI Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#0b1220;color:#e5e7eb}
    .card{background:#111827;color:#e5e7eb;border-color:#334155}
    .form-select,.form-control{background:#0f172a;color:#fff;border-color:#475569}
    .muted{color:#94a3b8}
  </style>
</head>
<body>
<main class="container py-5">
  <h1>Multi-Sport AI Predictor</h1>
  <p class="muted">Fotbal ČR · FIFA/UEFA · NBA · NHL</p>

  <div class="card p-4">
    <div class="row g-3">
      <div class="col-md-4">
        <label>Sport</label>
        <select id="sport" class="form-select">
          <option value="cz_football">Fotbal ČR</option>
          <option value="fifa">FIFA / Euro / Liga mistrů</option>
          <option value="nba">NBA</option>
          <option value="nhl">NHL</option>
        </select>
      </div>
      <div class="col-md-4"><label>Tým A</label><select id="a" class="form-select"></select></div>
      <div class="col-md-4"><label>Tým B</label><select id="b" class="form-select"></select></div>
      <div class="col-12"><button id="go" class="btn btn-primary">Spočítat predikci</button></div>
    </div>
  </div>

  <div id="error" class="alert alert-danger mt-3 d-none"></div>

  <div id="result" class="card p-4 mt-3 d-none">
    <h3 id="match"></h3>
    <p>Model: <strong id="model"></strong></p>
    <p id="dataSeasonRow" class="d-none">Sezóna dat modelu: <strong id="dataSeason"></strong></p>
    <p id="targetSeasonRow" class="d-none">Sezóna predikovaného zápasu: <strong id="targetSeason"></strong></p>
    <p id="matchDateRow" class="d-none">Datum zápasu: <strong id="matchDate"></strong></p>
    <p id="historyRangeRow" class="d-none">Rozsah použitých historických zápasů: <strong id="historyRange"></strong></p>
    <p id="dataAgeRow" class="d-none">Stáří dat: <strong id="dataAge"></strong></p>
    <p id="reliabilityRow" class="d-none">Spolehlivost predikce: <span id="reliability" class="badge"></span></p>
    <p>Odhad skóre: <strong id="score"></strong></p>
    <p>Value Bet: <strong id="value"></strong> · <span id="rec" class="badge"></span></p>
    <h5>Pravděpodobnosti</h5>
    <div id="probs"></div>
    <p class="muted mt-3 mb-0" id="modes"></p>
    <div id="diagnostics" class="alert alert-warning mt-3 mb-0 d-none"></div>
  </div>
</main>

<script>
const sport=document.querySelector('#sport');
const a=document.querySelector('#a');
const b=document.querySelector('#b');
const err=document.querySelector('#error');
const res=document.querySelector('#result');
const diagnostics=document.querySelector('#diagnostics');

async function teams(){
  try{
    const r=await fetch('/api/teams?sport='+encodeURIComponent(sport.value));
    const d=await r.json();
    if(!r.ok)throw Error(d.error);
    a.innerHTML=d.teams.map(x=>`<option>${x}</option>`).join('');
    b.innerHTML=a.innerHTML;
    if(d.teams.length>1)b.selectedIndex=1;
  }catch(e){
    err.textContent=e.message;
    err.classList.remove('d-none');
  }
}

function formatDateOnly(value){
  if(!value)return null;
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return null;
  return new Intl.DateTimeFormat('cs-CZ',{day:'numeric',month:'numeric',year:'numeric'}).format(date);
}

function formatMatchDate(value){
  if(!value)return null;
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return null;
  return new Intl.DateTimeFormat('cs-CZ',{
    day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'
  }).format(date);
}

function seasonsAgeLabel(value){
  const n=Number(value);
  if(!Number.isFinite(n))return null;
  if(n===1)return '1 sezóna';
  if(n>=2&&n<=4)return n+' sezóny';
  return n+' sezon';
}

function showDiagnostics(d){
  const lines=[];
  for(const item of d.data_diagnostics||[]){
    lines.push(`Data ${item.team}: ${item.message} [${item.code}]`);
  }
  if(d.odds_diagnostic){
    lines.push(`Kurzy: ${d.odds_diagnostic.message} [${d.odds_diagnostic.code}]`);
  }
  diagnostics.textContent=lines.join(' | ');
  diagnostics.classList.toggle('d-none',lines.length===0);
}

async function predict(){
  err.classList.add('d-none');
  res.classList.add('d-none');
  diagnostics.classList.add('d-none');
  try{
    const r=await fetch('/api/predict',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({sport:sport.value,team_a:a.value,team_b:b.value})
    });
    const d=await r.json();
    if(!r.ok)throw Error(d.error);
    document.querySelector('#match').textContent=d.team_a+' vs '+d.team_b;
    document.querySelector('#model').textContent=d.model;
    const dataSeasonRow=document.querySelector('#dataSeasonRow');
    const targetSeasonRow=document.querySelector('#targetSeasonRow');
    if(d.data_season_label){
      document.querySelector('#dataSeason').textContent=d.data_season_label;
      dataSeasonRow.classList.remove('d-none');
    }else{
      dataSeasonRow.classList.add('d-none');
    }
    if(d.target_season_label){
      document.querySelector('#targetSeason').textContent=d.target_season_label;
      targetSeasonRow.classList.remove('d-none');
    }else{
      targetSeasonRow.classList.add('d-none');
    }

    const matchDateRow=document.querySelector('#matchDateRow');
    const matchDateText=formatMatchDate(d.match_date);
    if(matchDateText){
      document.querySelector('#matchDate').textContent=matchDateText;
      matchDateRow.classList.remove('d-none');
    }else{
      matchDateRow.classList.add('d-none');
    }

    const historyRangeRow=document.querySelector('#historyRangeRow');
    const from=formatDateOnly(d.historical_match_range?.from);
    const to=formatDateOnly(d.historical_match_range?.to);
    if(from&&to){
      const aCount=d.data_matches_used?.team_a;
      const bCount=d.data_matches_used?.team_b;
      const countText=Number.isFinite(aCount)&&Number.isFinite(bCount)
        ? ` (${aCount} + ${bCount} zápasů)`
        : '';
      document.querySelector('#historyRange').textContent=from+' – '+to+countText;
      historyRangeRow.classList.remove('d-none');
    }else{
      historyRangeRow.classList.add('d-none');
    }

    const dataAgeRow=document.querySelector('#dataAgeRow');
    const ageText=seasonsAgeLabel(d.data_age_seasons);
    if(ageText){
      document.querySelector('#dataAge').textContent=ageText;
      dataAgeRow.classList.remove('d-none');
    }else{
      dataAgeRow.classList.add('d-none');
    }

    const reliabilityRow=document.querySelector('#reliabilityRow');
    const reliability=document.querySelector('#reliability');
    if(d.reliability_label){
      reliability.textContent=d.reliability_label;
      reliability.className='badge '+(d.limited_reliability?'text-bg-warning':'text-bg-success');
      reliabilityRow.classList.remove('d-none');
    }else{
      reliabilityRow.classList.add('d-none');
    }

    document.querySelector('#score').textContent=d.expected_score.home+' : '+d.expected_score.away;
    const value=document.querySelector('#value');
    const rec=document.querySelector('#rec');
    if(d.is_actionable){
      value.textContent=(d.best_value_pct>0?'+':'')+d.best_value_pct+'%';
      rec.textContent=d.recommendation;
      rec.className='badge '+(d.recommendation==='SÁZET'?'text-bg-success':'text-bg-secondary');
    }else{
      value.textContent='Nedostupný – používají se demo kurzy';
      rec.textContent='DEMO – BEZ DOPORUČENÍ';
      rec.className='badge text-bg-warning';
    }
    document.querySelector('#probs').innerHTML=Object.entries(d.probabilities).map(([k,v])=>`<div>${k}: <strong>${v}%</strong></div>`).join('');
    document.querySelector('#modes').textContent='Data: '+d.data_mode+' | Kurzy: '+d.odds_mode;
    showDiagnostics(d);
    res.classList.remove('d-none');
  }catch(e){
    err.textContent=e.message;
    err.classList.remove('d-none');
  }
}

sport.addEventListener('change',teams);
document.querySelector('#go').addEventListener('click',predict);
teams();
</script>
</body>
</html>
