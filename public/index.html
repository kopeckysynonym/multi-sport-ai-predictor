<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-Sport AI Predictor</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#0b1220;color:#e5e7eb}.card{background:#111827;color:#e5e7eb;border-color:#334155}.form-select,.form-control{background:#0f172a;color:#fff;border-color:#475569}.muted{color:#94a3b8}</style></head><body><main class="container py-5"><h1>Multi-Sport AI Predictor</h1><p class="muted">Fotbal ČR · FIFA/UEFA · NBA · NHL</p><div class="card p-4"><div class="row g-3"><div class="col-md-4"><label>Sport</label><select id="sport" class="form-select"><option value="cz_football">Fotbal ČR</option><option value="fifa">FIFA / Euro / Liga mistrů</option><option value="nba">NBA</option><option value="nhl">NHL</option></select></div><div class="col-md-4"><label>Tým A</label><select id="a" class="form-select"></select></div><div class="col-md-4"><label>Tým B</label><select id="b" class="form-select"></select></div><div class="col-12"><button id="go" class="btn btn-primary">Spočítat predikci</button></div></div></div><div id="error" class="alert alert-danger mt-3 d-none"></div><div id="result" class="card p-4 mt-3 d-none"><h3 id="match"></h3><p>Model: <strong id="model"></strong></p><p>Odhad skóre: <strong id="score"></strong></p><p>Value Bet: <strong id="value"></strong> · <span id="rec" class="badge"></span></p><h5>Pravděpodobnosti</h5><div id="probs"></div><p class="muted mt-3 mb-0" id="modes"></p></div></main><script>const sport=document.querySelector('#sport'),a=document.querySelector('#a'),b=document.querySelector('#b'),err=document.querySelector('#error'),res=document.querySelector('#result');async function teams(){try{const r=await fetch('/api/teams?sport='+encodeURIComponent(sport.value)),d=await r.json();if(!r.ok)throw Error(d.error);a.innerHTML=d.teams.map(x=>`<option>${x}</option>`).join('');b.innerHTML=a.innerHTML;if(d.teams.length>1)b.selectedIndex=1}catch(e){err.textContent=e.message;err.classList.remove('d-none')}}async function predict(){err.classList.add('d-none');res.classList.add('d-none');try{const r=await fetch('/api/predict',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sport:sport.value,team_a:a.value,team_b:b.value})}),d=await r.json();if(!r.ok)throw Error(d.error);document.querySelector('#match').textContent=d.team_a+' vs '+d.team_b;document.querySelector('#model').textContent=d.model;document.querySelector('#score').textContent=d.expected_score.home+' : '+d.expected_score.away;document.querySelector('#value').textContent=(d.best_value_pct>0?'+':'')+d.best_value_pct+'%';const rec=document.querySelector('#rec');rec.textContent=d.recommendation;rec.className='badge '+(d.recommendation==='SÁZET'?'text-bg-success':'text-bg-secondary');document.querySelector('#probs').innerHTML=Object.entries(d.probabilities).map(([k,v])=>`<div>${k}: <strong>${v}%</strong></div>`).join('');document.querySelector('#modes').textContent='Data: '+d.data_mode+' | Kurzy: '+d.odds_mode;res.classList.remove('d-none')}catch(e){err.textContent=e.message;err.classList.remove('d-none')}}sport.addEventListener('change',teams);document.querySelector('#go').addEventListener('click',predict);teams();</script></body></html>
